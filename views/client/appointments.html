<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f57d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d131d" media="(prefers-color-scheme: dark)" />
    <title>Mis citas · Cliente</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      /* Se aplica el tema ANTES de pintar. Si se hiciera en el modulo, un
         visitante en oscuro veria un destello blanco mientras espera al /me. */
      (function () {
        try {
          var t = localStorage.getItem('agenda26_tema') || 'auto';
          if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* Modo privado sin localStorage: se queda el tema del sistema. */
        }
      })();
    </script>

    <script type="module" src="/js/client/appointments.js"></script>
  </head>
  <body data-page="client-appointments">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <a class="brand" href="/cliente">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span class="brand-text"><strong data-marca-negocio>Agenda26</strong><small>Panel del cliente</small></span>
          </a>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
        <div class="sidebar-foot">
          <span class="badge" data-insignia-rol></span>
          <span class="user-chip" data-nombre-usuario></span>
          <button class="btn btn-quiet btn-block" data-salir type="button" style="margin-top: 0.5rem">Salir</button>
        </div>
      </aside>

      <div>
        <header class="app-header">
          <div class="app-header-inner">
            <a class="brand" href="/cliente">
              <span class="brand-mark" aria-hidden="true">A</span>
              <span class="brand-text"><strong data-subtitulo-negocio>Agenda26</strong></span>
            </a>
            <div class="header-actions">
              <span class="badge" data-insignia-rol></span>
              <span class="user-chip" data-nombre-usuario></span>
              <button class="btn btn-quiet btn-sm" data-salir type="button">Salir</button>
            </div>
          </div>
        </header>

        <main class="app-content" id="contenido">
          <section class="page-head">
            <div>
              <p class="eyebrow">Panel del cliente</p>
              <h1>Mis citas</h1>
              <p class="lead">Cada cita con su servicio, fecha, hora, anotación y estado. Sólo ves las tuyas.</p>
            </div>
            <div class="page-actions">
              <a class="btn btn-primary" href="/cliente">Reservar un horario</a>
            </div>
          </section>

          <section class="stats-grid" aria-label="Resumen">
            <article class="stat-card"><span>Total</span><strong id="stat-total">—</strong></article>
            <article class="stat-card stat-card--warning">
              <span>Pendientes</span><strong id="stat-pendientes">—</strong>
            </article>
            <article class="stat-card stat-card--success">
              <span>Coordinadas</span><strong id="stat-coordinadas">—</strong>
            </article>
            <article class="stat-card"><span>Completadas</span><strong id="stat-completadas">—</strong></article>
          </section>

          <section class="panel">
            <div class="toolbar">
              <label class="field">
                <span class="sr-only">Filtrar por estado</span>
                <select id="filtro-estado">
                  <option value="">Todos los estados</option>
                  <option value="PENDING">Pendientes</option>
                  <option value="COORDINATED">Coordinadas</option>
                  <option value="COMPLETED">Completadas</option>
                  <option value="CANCELLED">Canceladas</option>
                  <option value="REJECTED">Rechazadas</option>
                  <option value="NO_SHOW">No asistí</option>
                </select>
              </label>
              <div class="toolbar-actions">
                <button class="btn btn-quiet btn-sm" id="recargar" type="button">Recargar</button>
              </div>
            </div>

            <div class="stack-list" id="lista-citas">
              <div class="skeleton skeleton-card"></div>
              <div class="skeleton skeleton-card"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Navegación principal"></nav>

    <dialog class="modal" id="detalle-dialog" aria-labelledby="detalle-title"></dialog>
  </body>
</html>
