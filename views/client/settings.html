<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f57d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d131d" media="(prefers-color-scheme: dark)" />
    <title>Ajustes · Mi cuenta</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      /* Se aplica el tema ANTES de pintar. Si se hiciera en el modulo, un visitante
         en oscuro veria un destello blanco mientras espera al /me. */
      (function () {
        try {
          var t = localStorage.getItem('agenda26_tema') || 'auto';
          if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* Modo privado sin localStorage: se queda el tema del sistema. */
        }
      })();
    </script>

    <script type="module" src="/js/client/settings.js"></script>
  </head>
  <body data-page="client-settings">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <a class="brand" href="/cliente">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span class="brand-text"><strong data-marca-negocio>Agenda26</strong><small>Mi cuenta</small></span>
          </a>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
        <div class="sidebar-foot">
          <span class="badge" data-insignia-rol></span>
          <span class="user-chip" data-nombre-usuario></span>
          <button class="btn btn-quiet btn-block" data-salir type="button">Salir</button>
        </div>
      </aside>

      <div>
        <header class="app-header">
          <div class="app-header-inner">
            <a class="brand" href="/cliente">
              <span class="brand-mark" aria-hidden="true">A</span>
              <span class="brand-text"><strong data-subtitulo-negocio>Agenda26</strong></span>
            </a>
            <div class="header-actions">
              <span class="badge" data-insignia-rol></span>
              <span class="user-chip" data-nombre-usuario></span>
              <button class="btn btn-quiet btn-sm" data-salir type="button">Salir</button>
            </div>
          </div>
        </header>

        <main class="app-content" id="contenido">
          <section class="page-head">
            <div>
              <p class="eyebrow">Mi cuenta</p>
              <h1>Ajustes</h1>
              <p class="lead">Qué avisos recibes, cómo ves la aplicación y qué sesiones tienes abiertas.</p>
            </div>
          </section>

          <div class="grid-2 grid-2-wide">
            <!-- Preferencias -->
            <section class="panel">
              <div class="panel-head">
                <div>
                  <p class="eyebrow">Avisos</p>
                  <h2>Notificaciones</h2>
                </div>
              </div>

              <form id="form-ajustes" novalidate>
                <label class="check-field field-wide">
                  <input id="s-email" name="emailOptIn" type="checkbox" />
                  <span>
                    Quiero recibir correos
                    <small
                      >Confirmación de cita, recordatorios y avisos de cambios. Los avisos dentro de la aplicación no se
                      pueden desactivar.</small
                    >
                  </span>
                </label>

                <label class="field field-wide">
                  <span>Zona horaria</span>
                  <input id="s-timezone" name="timezone" list="zonas" placeholder="America/Montevideo" maxlength="60" />
                  <datalist id="zonas">
                    <option value="America/Montevideo"></option>
                    <option value="America/Argentina/Buenos_Aires"></option>
                    <option value="America/Bogota"></option>
                    <option value="America/Mexico_City"></option>
                    <option value="America/Santiago"></option>
                    <option value="America/Sao_Paulo"></option>
                    <option value="Europe/Madrid"></option>
                    <option value="Europe/Lisbon"></option>
                    <option value="UTC"></option>
                  </datalist>
                  <small>Se usa para saber qué día es "hoy" en tu calendario. Si no la sabes, déjala vacía.</small>
                </label>

                <label class="field field-wide">
                  <span>Aspecto</span>
                  <select id="s-theme" name="theme">
                    <option value="system">Como el sistema</option>
                    <option value="light">Claro</option>
                    <option value="dark">Oscuro</option>
                  </select>
                </label>

                <p class="form-error" id="ajustes-error" role="alert" hidden></p>

                <div class="modal-actions">
                  <button class="btn btn-primary" type="submit" id="ajustes-guardar">Guardar</button>
                </div>
              </form>
            </section>

            <!-- Sesiones -->
            <section class="panel">
              <div class="panel-head">
                <div>
                  <p class="eyebrow">Seguridad</p>
                  <h2>Sesiones abiertas</h2>
                </div>
              </div>

              <p class="muted small">
                Cada vez que entras se abre una sesión. Si no reconoces alguna, ciérrala y cambia la contraseña.
              </p>

              <div id="sesiones" class="stack-list"></div>

              <div class="panel-foot">
                <button class="btn btn-danger btn-sm" id="cerrar-todas" type="button">Cerrar todas mis sesiones</button>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Navegación principal"></nav>
  </body>
</html>
