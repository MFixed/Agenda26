<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#2f57d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d131d" media="(prefers-color-scheme: dark)" />
    <title>Plataforma · Negocios</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      /* Se aplica el tema ANTES de pintar. Si se hiciera en el modulo, un
         visitante en oscuro veria un destello blanco mientras espera al /me. */
      (function () {
        try {
          var t = localStorage.getItem('agenda26_tema') || 'auto';
          if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* Modo privado sin localStorage: se queda el tema del sistema. */
        }
      })();
    </script>

    <script type="module" src="/js/super.js"></script>
  </head>
  <body data-page="super">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <div class="app-shell">
      <!-- Sidebar: solo visible en escritorio (>=1024px). -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <a class="brand" href="/super">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span class="brand-text"><strong data-marca-negocio>Agenda26</strong><small>Plataforma</small></span>
          </a>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
        <div class="sidebar-foot">
          <span class="badge" data-insignia-rol></span>
          <span class="user-chip" data-nombre-usuario></span>
          <button class="btn btn-quiet btn-block" data-salir type="button" style="margin-top: 0.5rem">Salir</button>
        </div>
      </aside>

      <div>
        <header class="app-header">
          <div class="app-header-inner">
            <a class="brand" href="/super">
              <span class="brand-mark" aria-hidden="true">A</span>
              <span class="brand-text"><strong data-subtitulo-negocio>Agenda26</strong></span>
            </a>
            <div class="header-actions">
              <span class="badge" data-insignia-rol></span>
              <span class="user-chip" data-nombre-usuario></span>
              <button class="btn btn-quiet btn-sm" data-salir type="button">Salir</button>
            </div>
          </div>
        </header>

        <main class="app-content" id="contenido">
          <section class="page-head">
            <div>
              <p class="eyebrow">Plataforma</p>
              <h1>Negocios</h1>
              <p class="lead">
                Cada empresa tiene sus administradores, sus clientes y sus citas, y no ve nada de las demás. Desactivar
                una empresa le cierra las puertas sin borrar sus datos.
              </p>
            </div>
          </section>

          <section class="panel" style="margin-bottom: 1.5rem">
            <div class="panel-head">
              <h2>Crear un negocio</h2>
            </div>
            <form id="negocio-form" class="form-grid" novalidate>
              <label class="field">
                <span>Nombre del negocio *</span>
                <input id="nombre" name="nombre" type="text" maxlength="120" required />
              </label>

              <label class="field">
                <span>Identificador (URL) *</span>
                <input id="slug" name="slug" type="text" maxlength="60" placeholder="mi-negocio" required />
                <small>Con esto se entra: /b/mi-negocio/login</small>
              </label>

              <label class="field field-wide">
                <span>Descripción</span>
                <input id="descripcion" name="descripcion" type="text" maxlength="240" />
              </label>

              <label class="field">
                <span>Nombre del primer administrador *</span>
                <input id="adminNombre" name="adminNombre" type="text" maxlength="120" required />
              </label>

              <label class="field">
                <span>Correo del administrador *</span>
                <input id="adminEmail" name="adminEmail" type="email" maxlength="254" required />
              </label>

              <label class="field">
                <span>Contraseña del administrador *</span>
                <input
                  id="adminPassword"
                  name="adminPassword"
                  type="password"
                  minlength="8"
                  maxlength="128"
                  autocomplete="new-password"
                  required
                />
              </label>

              <p class="form-error field-wide" id="form-error" role="alert" hidden></p>
              <div class="field-wide page-actions">
                <button class="btn btn-primary" type="submit">Crear negocio</button>
              </div>
            </form>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Negocios existentes</h2>
              <button class="btn btn-quiet btn-sm" id="recargar" type="button">Recargar</button>
            </div>

            <p class="form-error" id="lista-error" role="alert" hidden></p>

            <!-- En móvil la tabla se convierte en tarjetas apiladas y en
                 escritorio vuelve a ser tabla: mismo marcado, dos lecturas. -->
            <div id="tabla-negocios">
              <div class="skeleton skeleton-card"></div>
              <div class="skeleton skeleton-card"></div>
              <div class="skeleton skeleton-card"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- Barra inferior: solo visible por debajo de 1024px. -->
    <nav class="tabbar" id="tabbar" aria-label="Navegación principal"></nav>
  </body>
</html>
