<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#2f57d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d131d" media="(prefers-color-scheme: dark)" />
    <title>Poner nueva contraseña · Agenda26</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      /* Se aplica el tema ANTES de pintar. Si se hiciera en el modulo, un
         visitante en oscuro veria un destello blanco mientras espera al /me. */
      (function () {
        try {
          var t = localStorage.getItem('agenda26_tema') || 'auto';
          if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* Modo privado sin localStorage: se queda el tema del sistema. */
        }
      })();
    </script>

    <script type="module" src="/js/auth.js"></script>
  </head>
  <!--
    Ruta prevista: /reset-password?token=...
    El correo de recuperación apunta aqui. El token llega en la URL y se gasta
    una sola vez; por eso esta pagina no salta al panel aunque haya otra sesion
    abierta en el mismo navegador (ver auth.js).
  -->
  <body class="auth-page" data-page="reset">
    <main class="auth-shell">
      <a class="brand auth-brand" href="/">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-text"><strong>Agenda26</strong><small>Citas, tareas y clientes</small></span>
      </a>

      <section class="auth-card" aria-labelledby="reset-title">
        <p class="eyebrow">Seguridad</p>
        <h1 id="reset-title">Poner nueva contraseña</h1>
        <p class="muted">Elige una contraseña nueva para tu cuenta de Agenda26.</p>

        <form id="auth-form" method="post" novalidate>
          <label class="field">
            <span>Nueva contraseña *</span>
            <input
              id="password"
              name="password"
              type="password"
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
              required
              autofocus
            />
            <small>Mínimo 8 caracteres, con letras y números.</small>
          </label>

          <label class="field">
            <span>Repite la contraseña nueva *</span>
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
              required
            />
          </label>

          <p class="form-error" id="auth-error" role="alert" hidden></p>
          <button class="btn btn-primary btn-block" id="auth-submit" type="submit">Actualizar contraseña</button>
        </form>

        <p class="note" style="margin-top: 1rem">
          Al cambiar la contraseña se cierran todas las sesiones abiertas, incluida esta. Volverás a la puerta de acceso
          para entrar con la nueva.
        </p>

        <p class="auth-switch"><a href="/login" data-puerta>Volver al inicio de sesión</a></p>
      </section>
    </main>
  </body>
</html>
