<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Gestión de tareas, clientes y citas">
    <title>Gestión de citas</title>
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body class="auth-page" data-page="inicio">
    <main class="auth-shell">
      <a class="brand auth-brand" href="/inicio">
        <span class="brand-mark" aria-hidden="true">G</span>
        <span><strong>Gestión</strong><small>Tareas, clientes y citas</small></span>
      </a>

      <section class="auth-card">
        <p class="eyebrow">Bienvenido</p>
        <h1 id="inicio-titulo">Gestión de citas</h1>
        <p class="muted" id="inicio-texto">Cada negocio tiene su propia puerta. Escribe su identificador para entrar.</p>

        <form id="negocio-form">
          <label class="field">
            <span>Identificador de tu negocio</span>
            <input id="negocio-slug" type="text" placeholder="tu-negocio" autocomplete="off" required>
          </label>
          <button class="button button-primary" type="submit" style="width:100%">Ir a su acceso</button>
        </form>

        <p class="auth-switch" style="margin-top:1rem">
          <a href="/login">Acceso de la plataforma (superadministrador)</a>
        </p>
      </section>
    </main>

    <script type="module">
      import { leerToken, panelDe, get } from "/js/api.js";

      const titulo = document.querySelector("#inicio-titulo");
      const texto = document.querySelector("#inicio-texto");

      if (leerToken()) {
        get("/api/auth/me")
          .then((sesion) => {
            titulo.textContent = `Hola, ${sesion.user.nombre.split(" ")[0]}`;
            texto.textContent = "Te llevamos a tu panel…";
            window.location.replace(panelDe(sesion.user.role));
          })
          .catch(() => {});
      }

      document.querySelector("#negocio-form").addEventListener("submit", (evento) => {
        evento.preventDefault();
        const slug = document.querySelector("#negocio-slug").value
          .trim()
          .toLowerCase()
          .replace(/\s+/g, "-")
          .replace(/[^a-z0-9-]/g, "");
        if (slug) {
          window.location.assign(`/b/${slug}/login`);
        }
      });
    </script>
  </body>
</html>
