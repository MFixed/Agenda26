<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f57d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d131d" media="(prefers-color-scheme: dark)" />
    <title>Calendario · Administración</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      /* Se aplica el tema ANTES de pintar. Si se hiciera en el modulo, un
         visitante en oscuro veria un destello blanco mientras espera al /me. */
      (function () {
        try {
          var t = localStorage.getItem('agenda26_tema') || 'auto';
          if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* Modo privado sin localStorage: se queda el tema del sistema. */
        }
      })();
    </script>

    <script type="module" src="/js/admin/calendar.js"></script>
  </head>
  <body data-page="admin-calendar">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <a class="brand" href="/admin">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span class="brand-text"><strong data-marca-negocio>Agenda26</strong><small>Administración</small></span>
          </a>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
        <div class="sidebar-foot">
          <span class="badge" data-insignia-rol></span>
          <span class="user-chip" data-nombre-usuario></span>
          <button class="btn btn-quiet btn-block" data-salir type="button" style="margin-top: 0.5rem">Salir</button>
        </div>
      </aside>

      <div>
        <header class="app-header">
          <div class="app-header-inner">
            <a class="brand" href="/admin">
              <span class="brand-mark" aria-hidden="true">A</span>
              <span class="brand-text"><strong data-subtitulo-negocio>Agenda26</strong></span>
            </a>
            <div class="header-actions">
              <span class="badge" data-insignia-rol></span>
              <span class="user-chip" data-nombre-usuario></span>
              <button class="btn btn-quiet btn-sm" data-salir type="button">Salir</button>
            </div>
          </div>
        </header>

        <main class="app-content" id="contenido">
          <section class="page-head">
            <div>
              <p class="eyebrow">Administración</p>
              <h1>Calendario</h1>
              <p class="lead">
                Cada horario publicado es una línea, con su cita dentro si la tiene. Publicar horarios nuevos se hace
                desde el panel.
              </p>
            </div>
          </section>

          <section class="panel">
            <div class="cal-toolbar">
              <div class="cal-nav">
                <button class="icon-btn" id="anterior" type="button" aria-label="Periodo anterior">‹</button>
                <strong class="cal-title" id="periodo-titulo">—</strong>
                <button class="icon-btn" id="siguiente" type="button" aria-label="Periodo siguiente">›</button>
                <button class="btn btn-quiet btn-sm" id="hoy" type="button">Hoy</button>
              </div>

              <div class="cal-nav">
                <button class="btn btn-quiet btn-sm" id="vista-lista" type="button">Días</button>
                <button class="btn btn-quiet btn-sm" id="vista-semana" type="button">Semana</button>
                <button class="btn btn-quiet btn-sm" id="vista-mes" type="button">Mes</button>
              </div>
            </div>

            <div class="cal-legend">
              <span><i class="cal-mark cal-mark--cita">3</i> Citas</span>
              <span><i class="cal-mark cal-mark--libre">2</i> Horarios libres</span>
              <span><i class="cal-mark cal-mark--tarea">1</i> Tareas agendadas</span>
            </div>

            <div id="calendario">
              <div class="skeleton skeleton-card"></div>
              <div class="skeleton skeleton-card"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Navegación principal"></nav>

    <!-- Detalle de un día -->
    <dialog class="modal" id="dia-dialog" aria-labelledby="dia-dialog-title">
      <div class="modal-body" id="dia-contenido"></div>
    </dialog>

    <!-- Editar disponibilidad ya publicada. Publicar horarios nuevos se hace
         desde el panel principal. -->
    <dialog class="modal" id="hueco-dialog" aria-labelledby="hueco-dialog-title">
      <form id="hueco-form" method="post" novalidate>
        <div class="modal-head">
          <div>
            <p class="eyebrow">Disponibilidad</p>
            <h2 id="hueco-dialog-title">Editar horario</h2>
          </div>
          <button class="icon-btn" type="button" data-cerrar-dialogo aria-label="Cerrar">×</button>
        </div>

        <input id="hueco-id" type="hidden" />

        <div class="form-grid">
          <label class="field field-wide">
            <span>Fecha *</span>
            <input id="hueco-fecha" name="date" type="date" required />
          </label>

          <label class="field">
            <span>Desde *</span>
            <input id="hueco-inicio" name="startTime" type="time" value="15:00" required />
          </label>

          <label class="field">
            <span>Hasta *</span>
            <input id="hueco-fin" name="endTime" type="time" value="16:00" required />
          </label>

          <label class="field field-wide">
            <span>Estado</span>
            <select id="hueco-estado" name="status">
              <option value="AVAILABLE">Libre (los clientes pueden elegirlo)</option>
              <option value="BLOCKED">Bloqueado (no se puede reservar)</option>
              <option value="HELD">En espera (retenido por un cliente)</option>
            </select>
          </label>

          <label class="field field-wide">
            <span>Nota</span>
            <input id="hueco-nota" name="note" type="text" maxlength="200" placeholder="Ej: visita de 45 minutos" />
          </label>
        </div>

        <p class="form-error" id="hueco-error" role="alert" hidden></p>

        <div class="modal-actions">
          <button class="btn btn-danger" id="borrar-hueco" type="button">Eliminar</button>
          <span class="spacer"></span>
          <button class="btn btn-quiet" type="button" data-cerrar-dialogo>Cancelar</button>
          <button class="btn btn-primary" type="submit">Guardar</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="detalle-dialog" aria-labelledby="detalle-title"></dialog>
    <dialog class="modal" id="reprogramar-dialog" aria-labelledby="reprogramar-title"></dialog>
  </body>
</html>
