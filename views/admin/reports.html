<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f57d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d131d" media="(prefers-color-scheme: dark)" />
    <title>Informes · Administración</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('agenda26_tema') || 'auto';
          if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>

    <script type="module" src="/js/admin/reports.js"></script>
  </head>
  <body data-page="admin-reports">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <a class="brand" href="/admin">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span class="brand-text"><strong data-marca-negocio>Agenda26</strong><small>Administración</small></span>
          </a>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
        <div class="sidebar-foot">
          <span class="badge" data-insignia-rol></span>
          <span class="user-chip" data-nombre-usuario></span>
          <a class="btn btn-quiet btn-block" href="/admin/equipo" style="margin-top: 0.5rem">Equipo</a>
          <button class="btn btn-quiet btn-block" data-salir type="button">Salir</button>
        </div>
      </aside>

      <div>
        <header class="app-header">
          <div class="app-header-inner">
            <a class="brand" href="/admin">
              <span class="brand-mark" aria-hidden="true">A</span>
              <span class="brand-text"><strong data-subtitulo-negocio>Agenda26</strong></span>
            </a>
            <div class="header-actions">
              <span class="badge" data-insignia-rol></span>
              <span class="user-chip" data-nombre-usuario></span>
              <button class="btn btn-quiet btn-sm" data-salir type="button">Salir</button>
            </div>
          </div>
        </header>

        <main class="app-content" id="contenido">
          <section class="page-head">
            <div>
              <p class="eyebrow">Administración</p>
              <h1>Informes</h1>
              <p class="lead">Cómo se ha usado la agenda en el periodo elegido.</p>
            </div>
            <div class="page-actions">
              <button class="btn btn-quiet" id="exportar" type="button">Exportar CSV</button>
            </div>
          </section>

          <section class="toolbar" aria-label="Filtro de fechas">
            <label class="field">
              <span>Desde</span>
              <input id="desde" type="date" />
            </label>
            <label class="field">
              <span>Hasta</span>
              <input id="hasta" type="date" />
            </label>
            <button class="btn btn-primary" id="aplicar" type="button">Aplicar</button>
            <span class="muted small" id="rango-label"></span>
          </section>

          <section class="stats-grid" id="stats" aria-label="Resumen del periodo"></section>

          <section class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Agenda</p>
                <h2>Ocupación por día</h2>
              </div>
            </div>
            <div id="ocupacion"></div>
          </section>

          <div class="grid-2 grid-2-wide">
            <section class="panel">
              <div class="panel-head">
                <div>
                  <p class="eyebrow">Cartera</p>
                  <h2>Servicios más pedidos</h2>
                </div>
              </div>
              <div id="servicios"></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <div>
                  <p class="eyebrow">Fugas</p>
                  <h2>Motivos de cancelación</h2>
                </div>
              </div>
              <div id="motivos"></div>
            </section>
          </div>

          <section class="panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Confiabilidad</p>
                <h2>Ausencias por profesional</h2>
              </div>
            </div>
            <div id="ausencias"></div>
          </section>
        </main>
      </div>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Navegación principal"></nav>
  </body>
</html>
