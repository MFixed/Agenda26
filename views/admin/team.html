<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f57d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d131d" media="(prefers-color-scheme: dark)" />
    <title>Equipo · Administración</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('agenda26_tema') || 'auto';
          if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>

    <script type="module" src="/js/admin/team.js"></script>
  </head>
  <body data-page="admin-team">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <a class="brand" href="/admin">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span class="brand-text"><strong data-marca-negocio>Agenda26</strong><small>Administración</small></span>
          </a>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
        <div class="sidebar-foot">
          <span class="badge" data-insignia-rol></span>
          <span class="user-chip" data-nombre-usuario></span>
          <button class="btn btn-quiet btn-block" data-salir type="button">Salir</button>
        </div>
      </aside>

      <div>
        <header class="app-header">
          <div class="app-header-inner">
            <a class="brand" href="/admin">
              <span class="brand-mark" aria-hidden="true">A</span>
              <span class="brand-text"><strong data-subtitulo-negocio>Agenda26</strong></span>
            </a>
            <div class="header-actions">
              <span class="badge" data-insignia-rol></span>
              <span class="user-chip" data-nombre-usuario></span>
              <button class="btn btn-quiet btn-sm" data-salir type="button">Salir</button>
            </div>
          </div>
        </header>

        <main class="app-content" id="contenido">
          <section class="page-head">
            <div>
              <p class="eyebrow">Administración</p>
              <h1>Equipo</h1>
              <p class="lead">Quién entra al panel y con qué permisos.</p>
            </div>
            <div class="page-actions">
              <button class="btn btn-primary" id="nuevo" type="button">Añadir persona</button>
            </div>
          </section>

          <section class="toolbar" aria-label="Buscar en el equipo">
            <label class="field field-grow">
              <span class="sr-only">Buscar por nombre o email</span>
              <input id="buscar" type="search" placeholder="Buscar por nombre o email…" autocomplete="off" />
            </label>
            <span class="muted small" id="total"></span>
          </section>

          <section class="panel">
            <div id="lista"></div>
          </section>
        </main>
      </div>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Navegación principal"></nav>
  </body>
</html>
