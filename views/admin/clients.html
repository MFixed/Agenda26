<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f57d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d131d" media="(prefers-color-scheme: dark)" />
    <title>Clientes · Administración</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      /* Se aplica el tema ANTES de pintar. Si se hiciera en el modulo, un
         visitante en oscuro veria un destello blanco mientras espera al /me. */
      (function () {
        try {
          var t = localStorage.getItem('agenda26_tema') || 'auto';
          if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* Modo privado sin localStorage: se queda el tema del sistema. */
        }
      })();
    </script>

    <script type="module" src="/js/admin/clients.js"></script>
  </head>
  <body data-page="admin-clients">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <a class="brand" href="/admin">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span class="brand-text"><strong data-marca-negocio>Agenda26</strong><small>Administración</small></span>
          </a>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
        <div class="sidebar-foot">
          <span class="badge" data-insignia-rol></span>
          <span class="user-chip" data-nombre-usuario></span>
          <button class="btn btn-quiet btn-block" data-salir type="button" style="margin-top: 0.5rem">Salir</button>
        </div>
      </aside>

      <div>
        <header class="app-header">
          <div class="app-header-inner">
            <a class="brand" href="/admin">
              <span class="brand-mark" aria-hidden="true">A</span>
              <span class="brand-text"><strong data-subtitulo-negocio>Agenda26</strong></span>
            </a>
            <div class="header-actions">
              <span class="badge" data-insignia-rol></span>
              <span class="user-chip" data-nombre-usuario></span>
              <button class="btn btn-quiet btn-sm" data-salir type="button">Salir</button>
            </div>
          </div>
        </header>

        <main class="app-content" id="contenido">
          <section class="page-head">
            <div>
              <p class="eyebrow">Administración</p>
              <h1>Clientes</h1>
              <p class="lead">
                Alta, consulta y mantenimiento de fichas. El correo y la contraseña viven en la cuenta, no aquí.
              </p>
            </div>
            <div class="page-actions">
              <button class="btn btn-primary" id="nuevo-cliente" type="button">+ Nuevo cliente</button>
            </div>
          </section>

          <section class="stats-grid" aria-label="Resumen">
            <article class="stat-card"><span>Clientes</span><strong id="stat-total">—</strong></article>
            <article class="stat-card stat-card--success">
              <span>Con citas</span><strong id="stat-con-citas">—</strong>
            </article>
            <article class="stat-card stat-card--warning">
              <span>Inactivos</span><strong id="stat-inactivos">—</strong>
            </article>
            <article class="stat-card"><span>Alta este mes</span><strong id="stat-mes">—</strong></article>
          </section>

          <section class="panel">
            <div class="toolbar">
              <label class="field">
                <span class="sr-only">Buscar clientes</span>
                <input
                  id="buscar"
                  type="search"
                  placeholder="Buscar por nombre, documento, teléfono o correo"
                  autocomplete="off"
                />
              </label>
              <div class="toolbar-actions">
                <button class="btn btn-quiet btn-sm" id="recargar" type="button">Recargar</button>
              </div>
            </div>

            <div class="stack-list" id="lista-clientes">
              <div class="skeleton skeleton-card"></div>
              <div class="skeleton skeleton-card"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Navegación principal"></nav>

    <dialog class="modal" id="cliente-dialog" aria-labelledby="cliente-dialog-title">
      <form id="cliente-form" method="post" novalidate>
        <div class="modal-head">
          <div>
            <p class="eyebrow">Ficha</p>
            <h2 id="cliente-dialog-title">Nuevo cliente</h2>
          </div>
          <button class="icon-btn" type="button" data-cerrar-dialogo aria-label="Cerrar">×</button>
        </div>

        <input id="cliente-id" type="hidden" />

        <div class="form-grid">
          <label class="field field-wide">
            <span>Nombre y apellidos *</span>
            <input id="cliente-nombre" name="nombre" type="text" maxlength="120" required />
          </label>

          <label class="field">
            <span>Documento *</span>
            <input id="cliente-documento" name="documento" type="text" maxlength="30" required />
          </label>

          <label class="field">
            <span>Fecha de nacimiento *</span>
            <input id="cliente-nacimiento" name="fechaNacimiento" type="date" required />
          </label>

          <label class="field">
            <span>Correo electrónico *</span>
            <input id="cliente-email" name="email" type="email" maxlength="254" autocomplete="off" required />
          </label>

          <label class="field">
            <span>Teléfono</span>
            <input id="cliente-telefono" name="telefono" type="tel" maxlength="40" inputmode="tel" />
          </label>

          <label class="field field-wide">
            <span>Dirección</span>
            <input id="cliente-direccion" name="direccion" type="text" maxlength="240" />
          </label>

          <label class="field field-wide">
            <span id="cliente-password-label">Contraseña</span>
            <input
              id="cliente-password"
              name="password"
              type="password"
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
            />
            <small id="cliente-password-ayuda">Si la dejas vacía se genera una temporal.</small>
          </label>

          <label class="check-field field-wide">
            <input id="cliente-activo" name="activo" type="checkbox" checked />
            <span>Cuenta activa (puede iniciar sesión)</span>
          </label>
        </div>

        <p class="form-error" id="cliente-error" role="alert" hidden></p>

        <div class="modal-actions">
          <button class="btn btn-quiet" type="button" data-cerrar-dialogo>Cancelar</button>
          <button class="btn btn-primary" type="submit">Guardar</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="detalle-dialog" aria-labelledby="detalle-title"></dialog>
  </body>
</html>
