<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Crear una cuenta de cliente" />
    <meta name="theme-color" content="#2f57d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d131d" media="(prefers-color-scheme: dark)" />
    <title>Crear cuenta · Agenda26</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      /* Se aplica el tema ANTES de pintar. Si se hiciera en el modulo, un
         visitante en oscuro veria un destello blanco mientras espera al /me. */
      (function () {
        try {
          var t = localStorage.getItem('agenda26_tema') || 'auto';
          if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* Modo privado sin localStorage: se queda el tema del sistema. */
        }
      })();
    </script>

    <script type="module" src="/js/auth.js"></script>
  </head>
  <body class="auth-page" data-page="registro">
    <main class="auth-shell" style="width: min(100%, 42rem)">
      <a class="brand auth-brand" href="/">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-text"><strong>Agenda26</strong><small>Citas, tareas y clientes</small></span>
      </a>

      <section class="auth-card" aria-labelledby="registro-title">
        <p class="eyebrow">Nuevo cliente</p>
        <h1 id="registro-title">Crear cuenta</h1>
        <p class="muted">Con estos datos podrás solicitar servicios y seguir el estado de tus citas.</p>

        <form id="auth-form" method="post" novalidate>
          <div class="form-grid">
            <label class="field field-wide">
              <span>Nombre y apellidos *</span>
              <input
                id="nombre"
                name="nombre"
                type="text"
                maxlength="120"
                placeholder="Ana Martínez Ruiz"
                autocomplete="name"
                required
              />
            </label>

            <label class="field">
              <span>Documento *</span>
              <input
                id="documento"
                name="documento"
                type="text"
                maxlength="30"
                placeholder="12345678A"
                autocomplete="off"
                required
              />
            </label>

            <label class="field">
              <span>Fecha de nacimiento *</span>
              <input id="fechaNacimiento" name="fechaNacimiento" type="date" autocomplete="bday" required />
            </label>

            <label class="field">
              <span>Correo electrónico *</span>
              <input
                id="email"
                name="email"
                type="email"
                maxlength="254"
                autocomplete="email"
                inputmode="email"
                required
              />
            </label>

            <label class="field">
              <span>Teléfono</span>
              <input
                id="telefono"
                name="telefono"
                type="tel"
                maxlength="40"
                placeholder="+34 600 000 000"
                autocomplete="tel"
                inputmode="tel"
              />
            </label>

            <label class="field field-wide">
              <span>Dirección</span>
              <input
                id="direccion"
                name="direccion"
                type="text"
                maxlength="240"
                placeholder="Calle, número, piso, código postal, ciudad"
                autocomplete="street-address"
              />
            </label>

            <label class="field">
              <span>Contraseña *</span>
              <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                required
              />
              <small>Mínimo 8 caracteres, con letras y números.</small>
            </label>

            <label class="field">
              <span>Repite la contraseña *</span>
              <input
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                required
              />
            </label>
          </div>

          <!-- El opt-in de correo es una casilla desmarcada por defecto: si el
               usuario no la marca, la casilla se guarda a false y no hay que
               escribirlo en la base. -->
          <label class="check-field">
            <input id="emailOptIn" name="emailOptIn" type="checkbox" checked />
            <span>Avisarme por correo de mis citas (recordatorios y cambios de estado)</span>
          </label>

          <p class="form-error" id="auth-error" role="alert" hidden></p>
          <button class="btn btn-primary btn-block" id="auth-submit" type="submit">Crear cuenta</button>
        </form>

        <p class="auth-switch">¿Ya tienes cuenta? <a href="/login" data-puerta>Inicia sesión</a></p>
      </section>
    </main>
  </body>
</html>
