<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Iniciar sesión de clientes y administración" />
    <meta name="theme-color" content="#2f57d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d131d" media="(prefers-color-scheme: dark)" />
    <title>Iniciar sesión · Agenda26</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script>
      /* Se aplica el tema ANTES de pintar. Si se hiciera en el modulo, un
         visitante en oscuro veria un destello blanco mientras espera al /me. */
      (function () {
        try {
          var t = localStorage.getItem('agenda26_tema') || 'auto';
          if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* Modo privado sin localStorage: se queda el tema del sistema. */
        }
      })();
    </script>

    <script type="module" src="/js/auth.js"></script>
  </head>
  <body class="auth-page" data-page="login">
    <main class="auth-shell">
      <a class="brand auth-brand" href="/">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-text"><strong>Agenda26</strong><small>Citas, tareas y clientes</small></span>
      </a>

      <section class="auth-card" aria-labelledby="login-title">
        <p class="eyebrow">Acceso</p>
        <h1 id="login-title">Iniciar sesión</h1>
        <!-- El texto se ajusta en auth.js: esta misma pagina sirve para la
             puerta de cada negocio (/b/:slug/login) y para el acceso de la
             plataforma (/login), que no lleva identificador. -->
        <p class="muted" id="login-subtitulo">
          Clientes y administración usan el mismo acceso: el rol de la cuenta decide el panel.
        </p>

        <form id="auth-form" method="post" novalidate>
          <label class="field">
            <span>Correo electrónico</span>
            <input
              id="email"
              name="email"
              type="email"
              maxlength="254"
              autocomplete="email"
              inputmode="email"
              required
              autofocus
            />
          </label>

          <label class="field">
            <span>Contraseña</span>
            <input
              id="password"
              name="password"
              type="password"
              maxlength="128"
              autocomplete="current-password"
              required
            />
          </label>

          <p class="auth-switch" style="margin: 0.25rem 0 0; text-align: right">
            <a href="/recuperar" data-puerta>¿Has olvidado la contraseña?</a>
          </p>

          <p class="form-error" id="auth-error" role="alert" hidden></p>
          <button class="btn btn-primary btn-block" id="auth-submit" type="submit">Entrar</button>
        </form>

        <p class="auth-switch">¿Todavía no tienes cuenta? <a href="/registro" data-puerta>Regístrate</a></p>

        <!-- Las cuentas de ejemplo dependen de la puerta: en /login solo existe
             el superadministrador, y las cuentas del seed pertenecen a una
             empresa concreta. auth.js reescribe este bloque según el caso. -->
        <div class="auth-hint" id="demo">
          <strong>Cuentas de ejemplo</strong>
          <div class="demo-accounts">
            <button type="button" data-demo-email="admin@ejemplo.com" data-demo-password="Admin1234">
              <span>Administración</span><span class="muted">admin@ejemplo.com</span>
            </button>
            <button type="button" data-demo-email="ana@ejemplo.com" data-demo-password="Cliente1234">
              <span>Cliente</span><span class="muted">ana@ejemplo.com</span>
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
