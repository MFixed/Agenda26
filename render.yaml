# Configuración de despliegue para Render (Blueprint), con PostgreSQL.
#
#   Dashboard > New > Blueprint  ->  apunta al repositorio
#
# ANTES DE NADA: crea la base de datos. En el panel, New > Postgres, y anota el
# nombre. Este archivo la referencia por `fromDatabase`, así que tiene que existir
# antes de conectar el Blueprint.
#
# OJO CON EL FICHERO .env
# Si hay un .env en el repositorio con `DATABASE_URL="file:./dev.db"`, el
# despliegue falla con un error de protocolo. Está en el .gitignore, pero si se
# subió antes de añadirlo, sigue ahí: hay que borrarlo del repositorio
# (Settings > Secrets and environment, o el propio fichero en GitHub), no sólo
# ignorarlo.
#
# Documentación: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: agenda26
    runtime: node
    plan: free

    # Con PostgreSQL no hace falta disco: los datos viven en la base de datos, no
    # en el sistema de ficheros. Por eso esto sí puede ser el plan gratuito.
    #
    # La versión de Node sale de package.json ("engines"), con techo en la 24.
    # Sin techo, Render instalaba la 26, que es más nueva que Prisma 6.19.3.

    # --- Build ---
    #
    # Esto NO puede ser el arranque. Si se pone aquí, `npm install` nunca se
    # ejecuta, no hay node_modules y el despliegue falla por la razón que sea, no
    # por la que debería.
    buildCommand: npm ci && npx prisma generate

    # --- Arranque ---
    #
    # Migra antes de levantar. Con PostgreSQL da igual que sea aquí o en el build
    # (no hay disco que montar), pero en el arranque es lo correcto: si el build
    # pasa y luego falla el arranque, las migraciones no se aplican dos veces.
    startCommand: npm run start:prod

    # 200 sólo si la base responde. Si no hay DATABASE_URL, responde 503 y el
    # despliegue queda marcado como fallido en vez de fingir que funciona.
    healthCheckPath: /api/health

    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # La base se rellena sola desde el panel de Render. No hace falta escribir
      # la URL a mano, y así no se corre el riesgo de pegarla con los parámetros
      # que faltan.
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-citas
          property: connectionString

      # Sin esto, cada despliegue genera un secreto nuevo y cierra las sesiones
      # de todo el mundo.
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: gestion-citas
    plan: free
    postgresMajorVersion: "17"
