<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Gestión de tareas, clientes y citas">
    <title>Gestión de citas</title>
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body class="auth-page" data-page="inicio">
    <main class="auth-shell">
      <a class="brand auth-brand" href="/inicio">
        <span class="brand-mark" aria-hidden="true">G</span>
        <span><strong>Gestión</strong><small>Tareas, clientes y citas</small></span>
      </a>

      <section class="auth-card">
        <p class="eyebrow">Bienvenido</p>
        <h1 id="inicio-titulo">Comprobando sesión…</h1>
        <p class="muted" id="inicio-texto">Redirigiendo al panel que te corresponde.</p>

        <div class="hero-actions" style="margin-top:1rem">
          <a class="button button-primary" href="/login">Entrar</a>
          <a class="button button-quiet" href="/registro">Crear cuenta de cliente</a>
        </div>
      </section>
    </main>

    <script type="module">
      import { panelDe, leerToken, panelDe as panel } from "/js/api.js";
      import { get } from "/js/api.js";

      const titulo = document.querySelector("#inicio-titulo");
      const texto = document.querySelector("#inicio-texto");

      if (!leerToken()) {
        titulo.textContent = "Gestión de citas";
        texto.textContent =
          "Administración y clientes usan el mismo acceso. El rol de la cuenta decide el panel.";
      } else {
        get("/api/auth/me")
          .then((sesion) => {
            titulo.textContent = `Hola, ${sesion.user.nombre.split(" ")[0]}`;
            texto.textContent = "Te llevamos a tu panel…";
            window.location.replace(panel(sesion.user.role));
          })
          .catch(() => {
            titulo.textContent = "Gestión de citas";
            texto.textContent = "Tu sesión ya no es válida. Vuelve a entrar.";
          });
      }
      void panelDe;
    </script>
  </body>
</html>
