<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis citas · Cliente</title>
    <link rel="stylesheet" href="/css/app.css">
    <script type="module" src="/js/client/appointments.js"></script>
  </head>
  <body data-page="client-appointments">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/cliente">
          <span class="brand-mark" aria-hidden="true">G</span>
          <span><strong>Gestión</strong><small>Panel del cliente</small></span>
        </a>
        <nav class="nav-links" aria-label="Navegación principal">
          <a href="/cliente">Panel</a>
          <a class="active" href="/cliente/citas">Mis citas</a>
          <a href="/cliente/perfil">Mi perfil</a>
        </nav>
        <div class="topbar-actions">
          <span class="badge" id="rol-badge">…</span>
          <span class="user-chip" id="user-name">…</span>
          <button class="button button-quiet button-sm" id="logout-button" type="button">Salir</button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section class="hero">
        <div>
          <p class="eyebrow">Panel del cliente</p>
          <h1>Mis citas</h1>
          <p class="muted">Cada cita con su servicio, fecha, hora, anotación y estado. Sólo ves las tuyas.</p>
        </div>
        <div class="hero-actions">
          <button class="button button-primary" id="pedir-cita" type="button">Pedir cita</button>
        </div>
      </section>

      <section class="panel">
        <div class="toolbar">
          <label class="select-field">
            <span class="sr-only">Filtrar por estado</span>
            <select id="filtro-estado">
              <option value="">Todos los estados</option>
              <option value="PENDING">Pendientes</option>
              <option value="COORDINATED">Coordinadas</option>
              <option value="COMPLETED">Completadas</option>
              <option value="CANCELLED">Canceladas</option>
              <option value="REJECTED">Rechazadas</option>
            </select>
          </label>
        </div>

        <div class="stack-list" id="lista-citas"><p class="muted">Cargando…</p></div>
        <p class="message" id="lista-message" role="status"></p>
      </section>
    </main>

    <dialog class="modal" id="pedir-dialog" aria-labelledby="pedir-title">
      <form id="pedir-form" method="post" novalidate>
        <div class="modal-heading">
          <div>
            <p class="eyebrow">Solicitud</p>
            <h2 id="pedir-title">Pedir cita</h2>
          </div>
          <button class="icon-button" id="close-pedir" type="button" aria-label="Cerrar">×</button>
        </div>

        <label class="field">
          <span>Horario *</span>
          <select id="pedir-hueco" name="availabilityId" required></select>
        </label>
        <label class="field">
          <span>¿Qué necesitas?</span>
          <input id="pedir-servicio" name="servicio" type="text" maxlength="160" placeholder="Instalación de aire acondicionado">
        </label>
        <label class="field">
          <span>Categoría</span>
          <select id="pedir-categoria" name="categoria"></select>
        </label>
        <label class="field">
          <span>Anotación</span>
          <textarea id="pedir-nota" name="note" rows="3" maxlength="1000" placeholder="Opcional: cuéntanos brevemente para qué es la cita"></textarea>
        </label>

        <p class="form-error" id="pedir-error" role="alert" hidden></p>

        <div class="modal-actions">
          <button class="button button-quiet" id="cancel-pedir" type="button">Cancelar</button>
          <button class="button button-primary" type="submit">Enviar solicitud</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="detalle-dialog" aria-labelledby="detalle-title"></dialog>
    <dialog class="modal confirm-modal" id="confirm-dialog" aria-labelledby="confirm-title">
      <div class="confirm-inner">
        <div class="modal-heading">
          <h2 id="confirm-title">Confirmar</h2>
          <button class="icon-button" id="close-confirm" type="button" aria-label="Cerrar">×</button>
        </div>
        <p class="confirm-text" id="confirm-text"></p>
        <p class="confirm-warn" id="confirm-aviso"></p>
        <p class="message" id="confirm-message" role="status"></p>
        <div class="modal-actions">
          <button class="button button-quiet" id="cancel-confirm" type="button">Cancelar</button>
          <button class="button button-danger" id="accept-confirm" type="button">Aceptar</button>
        </div>
      </div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
