<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Registro de cliente">
    <title>Crear cuenta · Gestión de citas</title>
    <link rel="stylesheet" href="/css/app.css">
    <script type="module" src="/js/auth.js"></script>
  </head>
  <body class="auth-page" data-page="registro">
    <main class="auth-shell auth-shell-wide">
      <a class="brand auth-brand" href="/inicio">
        <span class="brand-mark" aria-hidden="true">G</span>
        <span><strong>Gestión</strong><small>Tareas, clientes y citas</small></span>
      </a>

      <section class="auth-card" aria-labelledby="registro-title">
        <p class="eyebrow">Nuevo cliente</p>
        <h1 id="registro-title">Crear cuenta</h1>
        <p class="muted">Con estos datos podrás solicitar servicios y seguir el estado de tus citas.</p>

        <form id="auth-form" method="post" novalidate>
          <div class="form-grid">
            <label class="field field-wide">
              <span>Nombre y apellidos *</span>
              <input id="nombre" name="nombre" type="text" maxlength="120" placeholder="Ana Martínez Ruiz" autocomplete="name" required>
            </label>
            <label class="field">
              <span>Documento *</span>
              <input id="documento" name="documento" type="text" maxlength="30" placeholder="12345678A" required>
            </label>
            <label class="field">
              <span>Fecha de nacimiento *</span>
              <input id="fechaNacimiento" name="fechaNacimiento" type="date" required>
            </label>
            <label class="field">
              <span>Correo electrónico *</span>
              <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
            </label>
            <label class="field">
              <span>Teléfono</span>
              <input id="telefono" name="telefono" type="tel" maxlength="40" placeholder="+34 600 000 000" autocomplete="tel">
            </label>
            <label class="field field-wide">
              <span>Dirección</span>
              <input id="direccion" name="direccion" type="text" maxlength="240" placeholder="Calle, número, piso, código postal, ciudad" autocomplete="street-address">
            </label>
            <label class="field">
              <span>Contraseña *</span>
              <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
              <small>Mínimo 8 caracteres, con letras y números.</small>
            </label>
            <label class="field">
              <span>Repite la contraseña *</span>
              <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
            </label>
          </div>

          <p class="form-error" id="auth-error" role="alert" hidden></p>
          <button class="button button-primary" id="auth-submit" type="submit">Crear cuenta</button>
        </form>

        <p class="auth-switch">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
      </section>
    </main>
  </body>
</html>
