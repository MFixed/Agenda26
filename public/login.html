<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Inicio de sesión de clientes y administración">
    <title>Iniciar sesión · Gestión de citas</title>
    <link rel="stylesheet" href="/css/app.css">
    <script type="module" src="/js/auth.js"></script>
  </head>
  <body class="auth-page" data-page="login">
    <main class="auth-shell">
      <a class="brand auth-brand" href="/inicio">
        <span class="brand-mark" aria-hidden="true">G</span>
        <span><strong>Gestión</strong><small>Tareas, clientes y citas</small></span>
      </a>

      <section class="auth-card" aria-labelledby="login-title">
        <p class="eyebrow">Acceso</p>
        <h1 id="login-title">Iniciar sesión</h1>
        <p class="muted">Clientes y administración usan el mismo acceso: el rol de la cuenta decide el panel.</p>

        <form id="auth-form" method="post" novalidate>
          <label class="field">
            <span>Correo electrónico</span>
            <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required autofocus>
          </label>
          <label class="field">
            <span>Contraseña</span>
            <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
          </label>
          <p class="form-error" id="auth-error" role="alert" hidden></p>
          <button class="button button-primary" id="auth-submit" type="submit">Entrar</button>
        </form>

        <p class="auth-switch">¿Todavía no tienes cuenta? <a href="/registro">Regístrate</a></p>

        <div class="auth-hint">
          <strong>Cuentas de ejemplo</strong>
          <div class="demo-accounts">
            <button type="button" data-demo-email="admin@ejemplo.com" data-demo-password="Admin1234">
              <span>Administración</span><span class="muted">admin@ejemplo.com</span>
            </button>
            <button type="button" data-demo-email="ana@ejemplo.com" data-demo-password="Cliente1234">
              <span>Cliente</span><span class="muted">ana@ejemplo.com</span>
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
